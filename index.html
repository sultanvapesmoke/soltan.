<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر السلطان</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        /* تصميم استمارة الطلب */
        .order-section {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .order-section h2 {
            text-align: center;
            color: #1a1a1a;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background: #28a745;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background: #218838;
        }

        #responseMsg {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        /* أزرار الواتساب العائمة (رقمين) */
        .whatsapp-btn {
            position: fixed;
            color: white;
            padding: 10px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.3s;
        }

        /* الزرار الأول (أسفل خالص) */
        .wa-primary {
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
        }
        .wa-primary:hover {
            background-color: #1eb954;
        }

        /* الزرار التاني (فوق الأول بشوية) */
        .wa-secondary {
            bottom: 75px;
            left: 20px;
            background-color: #128c7e;
        }
        .wa-secondary:hover {
            background-color: #0e6f63;
        }
    </style>
</head>
<body>

    <!-- قسم استمارة إتمام الطلب -->
    <section class="order-section">
        <h2>تأكيد الطلب - متجر السلطان</h2>
        
        <form id="sultanOrderForm">
            <div class="form-group">
                <label for="custName">الاسم الكامل:</label>
                <input type="text" id="custName" placeholder="أدخل اسمك" required>
            </div>

            <div class="form-group">
                <label for="custPhone">رقم الموبايل:</label>
                <input type="tel" id="custPhone" placeholder="01xxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="custAddress">العنوان بالتفصيل:</label>
                <textarea id="custAddress" rows="2" placeholder="المدينة، الشارع، رقم المبنى..." required></textarea>
            </div>

            <div class="form-group">
                <label for="orderDetails">المنتجات والكمية المطلوبة:</label>
                <textarea id="orderDetails" rows="3" placeholder="اكتب المشتريات والكميات هنا" required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">إرسال الطلب وإتمام الشراء</button>
        </form>

        <p id="responseMsg"></p>
    </section>

    <!-- زرار الواتساب الأول (الرئيسي) -->
    <a href="https://wa.me/201018104482?text=عندي استفسار بخصوص طلب في متجر السلطان" target="_blank" class="whatsapp-btn wa-primary">
        💬 واتساب (1)
    </a>

    <!-- زرار الواتساب التاني (الدعم أو الرقم الثاني) -->
    <a href="https://wa.me/201020595089?text=عندي مشكلة أو شكوى في متجر السلطان" target="_blank" class="whatsapp-btn wa-secondary">
        📞 واتساب (2)
    </a>

    <!-- كود الجافاسكريبت لربط الاستمارة بـ Google Sheets -->
    <script>
        // ضع رابط API الخاص بك من موقع SheetDB هنا بدلاً من الـ Link ده
        const scriptURL = 'https://sheetdb.io/api/v1/mojufsglq17hb';

        document.getElementById('sultanOrderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const responseMsg = document.getElementById('responseMsg');
            
            submitBtn.innerText = 'جاري إرسال الطلب...';
            submitBtn.disabled = true;

            // تجهيز البيانات المرسلة
            const formData = {
                data: {
                    "Name": document.getElementById('custName').value,
                    "Phone": document.getElementById('custPhone').value,
                    "Address": document.getElementById('custAddress').value,
                    "OrderDetails": document.getElementById('orderDetails').value,
                    "Timestamp": new Date().toLocaleString('ar-EG')
                }
            };

            fetch(scriptURL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                submitBtn.innerText = 'إرسال الطلب وإتمام الشراء';
                submitBtn.disabled = false;
                responseMsg.style.color = 'green';
                responseMsg.innerText = 'تم تسجيل طلبك بنجاح! سنتواصل معك قريباً.';
                document.getElementById('sultanOrderForm').reset();
            })
            .catch(error => {
                submitBtn.innerText = 'إرسال الطلب وإتمام الشراء';
                submitBtn.disabled = false;
                responseMsg.style.color = 'red';
                responseMsg.innerText = 'حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.';
            });
        });
    </script>
</body>
</html>
